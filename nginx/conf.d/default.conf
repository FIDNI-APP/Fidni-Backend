server {
    listen 80;
    
    # You can access your app using the EC2 public IP or hostname
    # No need to specify server_name with a domain

    # Static and media files
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ^~ /media/.parcours-uploads/ { return 404; }
    location ^~ /media/parcours-videos/ { return 404; }
    location ^~ /protected-parcours/ {
        internal;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        alias /var/www/media/parcours-videos/;
    }

    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy pass to Gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90;
    }
}
