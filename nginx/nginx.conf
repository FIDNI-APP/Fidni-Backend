upstream gunicorn {
    server 127.0.0.1:8000;
}

# Le tunnel Cloudflare parle en HTTP à ce conteneur mais annonce le protocole public
# (https) dans X-Forwarded-Proto : on le transmet tel quel à Django, sinon Django croit
# chaque requête en HTTP (pas de HSTS, liens absolus en http://).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    # Les pièces jointes sont limitées à 10 Mo côté Django ; marge pour les PDF à analyser.
    client_max_body_size 25M;

    # Les en-têtes de sécurité viennent de Django (X-Frame-Options DENY, HSTS, nosniff,
    # Referrer-Policy) ; les répéter ici envoyait des valeurs en double et contradictoires.

    # Timeouts
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Static files
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Administration Django : jamais par Internet. Tout ce qui passe par le tunnel
    # Cloudflare porte CF-Connecting-IP ; l'admin reste joignable en local
    # sur http://localhost:8080/admin/ (le port n'écoute que sur 127.0.0.1).
    location /admin/ {
        if ($http_cf_connecting_ip != "") {
            return 404;
        }
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    # Proxy to Django/Gunicorn
    location / {
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://gunicorn;
    }
}
