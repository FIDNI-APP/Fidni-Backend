# ── Fidni backend — production stack ────────────────────────────────────────
# Run:    docker compose up --build -d
# Logs:   docker compose logs -f fidni-backend
#
# Config/secrets come from ./.env (NOT committed — see .env.example).
# Database: AWS RDS PostgreSQL (password via AWS Secrets Manager, ~/.aws mounted).
# Media:    AWS S3 (django-storages).
# The backend binds to localhost only; the cloudflared tunnel
# (api.fidni.fr -> http://localhost:8080) is the single public entry point.

services:
  fidni-backend:
    image: fidni-backend
    container_name: fidni-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8080:80"   # localhost-only; the tunnel forwards here
    volumes:
      - ~/.aws:/root/.aws:ro   # boto3 credentials (Secrets Manager + S3)
    restart: unless-stopped
